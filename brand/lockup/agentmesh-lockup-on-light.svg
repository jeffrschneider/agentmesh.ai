  <rect x="17" y="17" width="12" height="12" rx="3.5" fill="none" stroke="#0A1417" stroke-width="2" opacity=".35"/>
  <rect x="3" y="17" width="12" height="12" rx="3.5" fill="#43D6A6"/>
  <rect x="17" y="3" width="12" height="12" rx="3.5" fill="#F2A93B"/>
  <text x="44" y="22" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif"
        font-size="19" font-weight="500" letter-spacing="-0.2" fill="#0A1417">Agent<tspan font-weight="700">Mesh</tspan></text>
