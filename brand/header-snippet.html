<!-- ─────────────────────────────────────────────────────────────────────────
     AgentMesh header lockup. Drops into the existing .topbar .bar in place of
     <a class="brand" href="index.html"><span class="dot"></span><span class="wm">AGENTMESH</span></a>

     Colors are literal hexes rather than var(--signal) / var(--verify) so the
     block works on any page, including ones that don't define those tokens.
     Space Grotesk is already loaded site-wide at weights 500/600/700.
     ───────────────────────────────────────────────────────────────────────── -->

<a class="brand" href="index.html" aria-label="AgentMesh home">
  <svg class="mark" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true" focusable="false">
    <rect x="3" y="3" width="12" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/>
    <rect x="17" y="17" width="12" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/>
    <rect x="3" y="17" width="12" height="12" rx="3.5" fill="#43D6A6"/>
    <rect x="17" y="3" width="12" height="12" rx="3.5" fill="#F2A93B"/>
  </svg>
  <span class="wm">Agent<b>Mesh</b></span>
</a>

<style>
/* Replaces the .brand and .brand .dot rules. The old .brand span.wm
   { margin-left:14px } goes away — the gap does that job now. */
.brand{ display:flex; align-items:center; gap:9px;
  color:var(--paper); text-decoration:none; }
.brand .mark{ flex:none; }
.brand .wm{ font-family:'Space Grotesk', sans-serif; font-weight:500;
  font-size:1.02rem; letter-spacing:-.01em; }
.brand .wm b{ font-weight:700; }
.brand:hover .wm b{ color:#F2A93B; }
</style>
